services:
  productos:
    build:
      context: .
      args:
        SERVICE: productos-service
    ports: ["8081:8081"]
    environment:
      PORT: 8081
      DB_URL: jdbc:h2:file:/app/data/productos
    volumes: [productos-data:/app/data]
  clientes:
    build:
      context: .
      args:
        SERVICE: clientes-service
    ports: ["8082:8082"]
    environment:
      PORT: 8082
      DB_URL: jdbc:h2:file:/app/data/clientes
    volumes: [clientes-data:/app/data]
  pedidos:
    build:
      context: .
      args:
        SERVICE: pedidos-service
    ports: ["8083:8083"]
    environment:
      PORT: 8083
      DB_URL: jdbc:h2:file:/app/data/pedidos
      PRODUCTOS_URL: http://productos:8081
      CLIENTES_URL: http://clientes:8082
    depends_on:
      productos:
        condition: service_healthy
      clientes:
        condition: service_healthy
    volumes: [pedidos-data:/app/data]
volumes:
  productos-data:
  clientes-data:
  pedidos-data:
