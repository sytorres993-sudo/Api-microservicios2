spring.application.name=pedidos-service
server.port=${PORT:8083}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pedidos}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
server.error.include-message=never
services.productos.url=${PRODUCTOS_URL:http://localhost:8081}
services.clientes.url=${CLIENTES_URL:http://localhost:8082}
